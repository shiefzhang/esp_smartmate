; ============================================================
; HW-364A 多功能遥控器 —— 编译配置
;
; 内存优化开关说明（实测数据见 docs/memory-report.md）：
;
;   LOG_LINE_COUNT / LOG_LINE_MAX
;       运行日志环形缓冲行数与单行长度。常驻 RAM = COUNT*MAX 字节。
;       20/100 = 2000 B（原 40/120 = 4800 B，省 2800 B）
;
;   ENABLE_OTA_UPDATE        网页 OTA 固件升级    置 0 省约 9 KB Flash
;   ENABLE_WEB_TIME_SYNC     worldtimeapi 授时    置 0 省约 1 KB Flash + 0.3 KB RAM
;                            关闭后自动改用 NTP(configTime)，不影响对时
;   ENABLE_IR_AC_PRESETS     红外空调预设库       置 0 省约 97 KB Flash
;
; 红外协议裁剪（下方 _IR_ENABLE_DEFAULT_ 段）
;       IRremoteESP8266 默认编译全部 124 种协议。这里把默认值设为 false，
;       只显式开启本机实际用到的 4 个品牌，可省 60~70 KB Flash。
;       新增品牌时，按 "品牌 -> 协议" 补对应的 SEND_xxx / DECODE_xxx 即可：
;         大金 -> DAIKIN* 系列（含 128/152/160/176/200/216/312 等变体）
;         格力 -> GREE
;         科龙/海信 -> KELON / KELON168
;         美的/华凌/小米 -> MIDEA / MIDEA24
;       DECODE_HASH 必须保留：红外"学习"功能依赖它作为兜底解码器，
;       否则 irrecv.decode() 对未知信号永远返回 false，学不到码。
; ============================================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_blinker.py

; 前端资源走 LittleFS：data/ 目录下的 app.css / app.js 需用
;   pio run -t uploadfs
; 写入文件系统。⚠️ uploadfs 会整盘重建文件系统，可能清掉已学习的
; 433/红外码；RF 码位会从 EEPROM 自动恢复（见 loadRfSlots），
; 红外码如非必要请先备份。日常只改固件用 -t upload 即可，不动文件系统。
board_build.filesystem = littlefs

build_flags =
  -DLOG_LINE_COUNT=20
  -DLOG_LINE_MAX=100
  -DENABLE_OTA_UPDATE=1
  -DENABLE_WEB_TIME_SYNC=0
  -DENABLE_IR_AC_PRESETS=1

  ; ---- 红外协议裁剪：默认关闭全部协议 ----
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_HASH=true
  ; SEND_RAW 必须保留：已学习红外码的发送走 irsend.sendRaw()。
  ; DECODE_HASH 必须保留：学习时 irrecv.decode() 依赖它作为兜底解码器，
  ; 否则未知信号一律返回 false，学不到码。
  -DSEND_RAW=true

  ; ---- 科龙 / 海信 ----
  -DDECODE_KELON=true
  -DSEND_KELON=true
  -DDECODE_KELON168=true
  -DSEND_KELON168=true

  ; ---- 大金 ----
  -DDECODE_DAIKIN=true
  -DSEND_DAIKIN=true
  -DDECODE_DAIKIN2=true
  -DSEND_DAIKIN2=true
  -DDECODE_DAIKIN64=true
  -DSEND_DAIKIN64=true
  -DDECODE_DAIKIN128=true
  -DSEND_DAIKIN128=true
  -DDECODE_DAIKIN152=true
  -DSEND_DAIKIN152=true
  -DDECODE_DAIKIN160=true
  -DSEND_DAIKIN160=true
  -DDECODE_DAIKIN176=true
  -DSEND_DAIKIN176=true
  -DDECODE_DAIKIN200=true
  -DSEND_DAIKIN200=true
  -DDECODE_DAIKIN216=true
  -DSEND_DAIKIN216=true
  -DDECODE_DAIKIN312=true
  -DSEND_DAIKIN312=true

  ; ---- 格力 ----
  -DDECODE_GREE=true
  -DSEND_GREE=true

  ; ---- 美的 / 华凌 / 小米 ----
  -DDECODE_MIDEA=true
  -DSEND_MIDEA=true
  -DDECODE_MIDEA24=true
  -DSEND_MIDEA24=true

lib_deps =
  sui77/rc-switch@^2.6.4
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  crankyoldgit/IRremoteESP8266@^2.8.6
  blinker
